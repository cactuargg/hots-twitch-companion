name: Windows build
'on':
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and package Desktop
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HotS-Twitch-Companion-Windows-x64
          path: |
            HotS-Twitch-Companion-v*-windows-x64.zip
            dist/HotS-Twitch-Companion-v*.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
  browser-fallback:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and package browser fallback
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: ./build.ps1 -BrowserFallback
      - uses: actions/upload-artifact@v4
        with:
          name: HotS-Twitch-Companion-Browser
          path: HotS-Twitch-Companion-Browser-v*.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, browser-fallback]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HotS-Twitch-Companion-Windows-x64
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: HotS-Twitch-Companion-Browser
          path: browser
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$(sha256sum browser/HotS-Twitch-Companion-Browser-v*.zip | sed 's#browser/##')" >> package/dist/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            package/dist/HotS-Twitch-Companion-v*.exe \
            package/HotS-Twitch-Companion-v*-windows-x64.zip \
            browser/HotS-Twitch-Companion-Browser-v*.zip \
            package/dist/SHA256SUMS.txt \
            --verify-tag --generate-notes --notes-file package/dist/RELEASE_NOTES.md
